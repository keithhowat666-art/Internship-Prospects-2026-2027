name: Refresh Internship Listings

on:
  schedule:
    - cron: "0 9 * * 1"   # Every Monday at 9:00 AM UTC
  workflow_dispatch:        # Manual trigger from GitHub UI → Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Push CSV + README changes back to repo
      issues: write         # Open a GitHub Issue on failure

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch internships from all sources
        env:
          ADZUNA_APP_ID:  ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/fetch_internships.py

      - name: Commit and push if changes were made
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add internships.csv README.md
          git diff --cached --quiet || git commit -m "chore: refresh listings $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `⚠️ Internship refresh failed — ${new Date().toISOString().slice(0,10)}`,
              body: [
                "The weekly internship refresh workflow failed.",
                "",
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                "",
                "Check the logs above for the failing step and source.",
              ].join("\n"),
              labels: ["bug", "automation"],
            });
